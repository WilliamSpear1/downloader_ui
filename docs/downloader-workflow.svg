<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title description">
  <title id="title">Downloader SPA workflow</title>
  <desc id="description">
    The user enters download details in the React SPA. Zod validates the form.
    Valid data is sent to the download endpoint, routed directly in local
    development or through Nginx in production, and processed by the downloader
    backend. Success resets the form and displays a confirmation; failures are
    logged in the browser console.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 16px; }
      .section { fill: #64748b; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .card-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .body { fill: #475569; font-size: 14px; }
      .small { fill: #64748b; font-size: 12px; }
      .label { fill: #334155; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1500" height="940" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Downloader SPA workflow</text>
  <text x="60" y="88" class="subtitle">From form validation to backend processing and user feedback</text>

  <rect x="40" y="120" width="1420" height="315" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="153" class="section">BROWSER · REACT SPA</text>

  <path d="M310 275H365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M650 275H687" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M813 275H870" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="832" y="260" class="label">valid</text>

  <path d="M750 338V385H510V350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="379" class="label">invalid: show field errors</text>

  <rect x="80" y="210" width="230" height="130" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="108" cy="239" r="15" fill="#dbeafe"/>
  <text x="108" y="244" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">1</text>
  <text x="133" y="245" class="card-title">User input</text>
  <text x="102" y="278" class="body">Source URL</text>
  <text x="102" y="301" class="body">Page count</text>
  <text x="102" y="324" class="body">Parent directory</text>

  <rect x="365" y="210" width="285" height="140" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="393" cy="239" r="15" fill="#dbeafe"/>
  <text x="393" y="244" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">2</text>
  <text x="418" y="245" class="card-title">Form + validation</text>
  <text x="387" y="279" class="body">React Hook Form + Zod</text>
  <text x="387" y="303" class="body">URL must be valid</text>
  <text x="387" y="327" class="body">Page count: positive integer</text>

  <polygon points="750,211 813,275 750,339 687,275" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="750" y="271" text-anchor="middle" class="card-title" font-size="16">Valid?</text>
  <text x="750" y="292" text-anchor="middle" class="small">schema check</text>

  <rect x="870" y="210" width="300" height="130" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="898" cy="239" r="15" fill="#dbeafe"/>
  <text x="898" y="244" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">3</text>
  <text x="923" y="245" class="card-title">Submit request</text>
  <text x="892" y="279" class="body">POST /download</text>
  <text x="892" y="303" class="body">JSON: url, number_of_pages,</text>
  <text x="892" y="325" class="body">parent_directory</text>

  <rect x="1200" y="205" width="220" height="140" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="1220" y="235" class="card-title" font-size="16">Loading state</text>
  <text x="1220" y="265" class="body">Initial 3-second overlay,</text>
  <text x="1220" y="287" class="body">then shown during submit;</text>
  <text x="1220" y="309" class="body">hidden when it completes.</text>

  <rect x="40" y="465" width="1420" height="285" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="498" class="section">API ROUTING · ENVIRONMENT DEPENDENT</text>

  <path d="M1020 340V430H295V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1020 430H735V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="454" class="label">local development</text>
  <text x="785" y="454" class="label">production</text>

  <rect x="110" y="535" width="370" height="145" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="136" y="570" class="card-title">Local development</text>
  <text x="136" y="602" class="body">VITE_API_URL points directly</text>
  <text x="136" y="625" class="body">to the backend origin.</text>
  <text x="136" y="655" class="small">Vite has no /download proxy configured.</text>

  <rect x="550" y="535" width="370" height="145" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="576" y="570" class="card-title">Production</text>
  <text x="576" y="602" class="body">Same-origin /download request</text>
  <text x="576" y="625" class="body">is forwarded by Nginx.</text>
  <text x="576" y="655" class="small">Nginx target: http://downloader:5000</text>

  <path d="M295 680V715H1000V700H1222V680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M920 607H1035" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1035" y="535" width="375" height="145" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="1065" cy="565" r="15" fill="#d1fae5"/>
  <text x="1065" y="570" text-anchor="middle" fill="#047857" font-size="13" font-weight="700">4</text>
  <text x="1090" y="571" class="card-title">Downloader backend</text>
  <text x="1060" y="606" class="body">Receives the download job.</text>
  <text x="1060" y="632" class="body">Backend is not included here.</text>
  <text x="1060" y="658" class="small">Must be reachable on the Docker network.</text>

  <rect x="40" y="780" width="1420" height="125" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="813" class="section">RESULT IN THE UI</text>

  <path d="M1222 680V740H500V825" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1222 740H1075V825" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="825" width="400" height="62" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="325" y="851" fill="#065f46" font-size="16" font-weight="700">HTTP success</text>
  <text x="325" y="874" fill="#047857" font-size="13">Reset form and show confirmation alert.</text>

  <rect x="875" y="825" width="400" height="62" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="900" y="851" fill="#9a3412" font-size="16" font-weight="700">Request failure</text>
  <text x="900" y="874" fill="#c2410c" font-size="13">Log details to the browser console.</text>
</svg>
